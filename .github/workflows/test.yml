name: Windows tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/quota_watcher.py --self-test
      - run: python scripts/test_watcher.py
      - run: python scripts/test_backup.py
      - run: python scripts/test_live_status.py
      - run: python scripts/test_popup.py
      - run: python scripts/test_app.py
      - run: python scripts/test_updater.py
      - run: python scripts/test_github_star.py
      - run: python scripts/test_star_ui.py
      - run: python scripts/test_delayed_followup.py
